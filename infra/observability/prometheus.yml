global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: megano
    metrics_path: /metrics/
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: [host.docker.internal:8000]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
