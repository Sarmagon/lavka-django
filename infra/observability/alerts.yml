groups:
  - name: megano
    rules:
      - alert: MeganoUnavailable
        expr: up{job="megano"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Сайт не отдаёт метрики"}
      - alert: PaymentWorkerStopped
        expr: megano_payment_worker_up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Обработчик платежей остановлен"}
      - alert: PaymentQueueDelayed
        expr: megano_payment_oldest_pending_seconds > 120
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Платёж находится в очереди более двух минут"}
      - alert: QueueDatabaseUnavailable
        expr: megano_queue_database_up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "База данных очереди недоступна"}
      - alert: HttpServerErrors
        expr: sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m])) > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Сайт отвечает с ошибками сервера"}
      - alert: DiskNearlyFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 0.9
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "На диске осталось менее 10% свободного места"}
