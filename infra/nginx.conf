# Example: replace domain and paths; configure HTTPS for public deployment.
server {
    listen 80;
    server_name megano.example;
    client_max_body_size 3m;
    location /static/ { alias /srv/megano/staticfiles/; }
    location /media/ { alias /srv/megano/media/; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
