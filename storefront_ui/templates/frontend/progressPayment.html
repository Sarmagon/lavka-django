{% extends 'frontend/base.html' %}{% block page %}order{% endblock %}{% block content %}<a class="back" href="/history-order/">← Мои заказы</a><div id="order-detail" aria-live="polite"></div><form id="payment-form" class="form" hidden><h2>Учебная оплата</h2><p>Введите чётный номер из 1–8 цифр, например 2468. Это имитация: настоящие номера карт не нужны.</p><label>Учебный номер<input name="number" inputmode="numeric" pattern="[0-9]{1,8}" maxlength="8" required></label><label>Способ<select name="paymentType"><option value="online">Самостоятельно</option><option value="someone">Другого лица</option></select></label><button>Отправить в очередь</button><p class="form-error" role="alert"></p></form><button id="refresh-order" class="secondary">Обновить статус</button>{% endblock %}
