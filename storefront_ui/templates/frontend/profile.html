{% extends 'frontend/base.html' %}{% block page %}profile{% endblock %}{% block content %}<div class="page-head"><h1>Ваш профиль</h1><a href="/history-order/">История заказов →</a></div><div class="profile-grid"><form id="profile-form" class="form"><label>Имя<input name="fullName" required></label><label>Email<input name="email" type="email" required></label><label>Телефон<input name="phone" type="tel" placeholder="+79991234567"></label><button>Сохранить</button><p class="form-error" role="alert"></p></form><section><img id="avatar" alt="Ваш аватар" hidden width="100"><form id="avatar-form" class="form"><label>Аватар<input name="avatar" type="file" accept="image/png,image/jpeg,image/webp" required></label><button>Загрузить</button><p class="form-error" role="alert"></p></form><button id="remove-avatar" class="secondary">Удалить аватар</button><form id="password-form" class="form"><h2>Сменить пароль</h2><label>Текущий пароль<input name="currentPassword" type="password" required autocomplete="current-password"></label><label>Новый пароль<input name="newPassword" type="password" required autocomplete="new-password"></label><button>Обновить пароль</button><p class="form-error" role="alert"></p></form><button id="logout" class="secondary">Выйти</button></section></div>{% endblock %}
