[project]
name = "lavka-django"
version = "0.1.0"
description = "Django demo shop with an original storefront, payment worker and observability"
authors = [
    {name = "РЎС‚Р°РЅРёСЃР»Р°РІ РЎРјРёСЂРЅРѕРІ",email = "stasus.sv@mail.ru"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "django (>=5.2.8,<5.3)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pillow>=11,<13",
    "sentry-sdk (>=2.72,<3)",
    "django-prometheus (>=2.5,<3)",
    "django-storages[s3] (>=1.14.6,<2)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
